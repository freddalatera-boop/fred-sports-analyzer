name: Gerar instalador Windows

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "test/**"
      - "package.json"
      - ".github/workflows/build-windows.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Baixar o projeto
        uses: actions/checkout@v4

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Instalar dependências
        run: npm install

      - name: Executar testes
        run: npm test

      - name: Gerar instalador
        run: npm run dist
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: Disponibilizar instalador
        uses: actions/upload-artifact@v4
        with:
          name: Fred-Sports-Analyzer-Windows
          path: |
            dist/*.exe
            dist/*.yml
          if-no-files-found: error
          retention-days: 30

      - name: Publicar na página de versões
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "build-${{ github.run_number }}"
          gh release create $tag "dist/Fred Sports Analyzer Setup 0.1.0.exe" --target "${{ github.sha }}" --title "Fred Sports Analyzer 0.1.0" --notes "Instalador automático para Windows 64 bits."
